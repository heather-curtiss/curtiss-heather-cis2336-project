<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ArtConnect</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js"></script>
</head>

<body>
    <header>
        <h1>Submit Artwork</h1>
        <nav>
            <ul>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="submit.html">Submit Art</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="references.html">References</a></li>
                <li><a href="../index.html">Home</a></li>
            </ul>
        </nav>
    </header>

<main>
<h2>Submission Form</h2>

<artform id="submitartform">
    <label>First and Last Name:</label>
    <input type="text" id="artistname">

    <label>Email Address:</label>
    <input type="text" id="email">

    <label>Phone Number:</label>
    <input type="text" id="phonenumber">

    <label>Artwork Title:</label>
    <input type="text" id="title">

    <label>Medium:</label>
    <select id="artworkmedium">
        <option value="select">Select</option>
        <option>Painting</option>
        <option>Sculpture</option>
        <option>Photography</option>
        <option>Architecture</option>
        <option>Charcoal</option>
        <option>Graphite</option>
        <option>Digital</option>
        <option>Mixed Mediums</option>
    </select>

    <label>Genre:</label>
    <select id="artworkgenre">
        <option value="select">Select</option>
        <option>Surrealism</option>
        <option>Realism</option>
        <option>Impressionism</option>
        <option>Abstract</option>
        <option>Art Deco</option>
        <option>Expressionalism</option>
        <option>Pop Art</option>
        <option>Multimedia</option>
    </select>

    <label>Price:</label>
    <input type="text"  id="price">

    <label>Description:</label>
    <textarea id="description"></textarea>

    <label>About the Artist:</label>
    <textarea id="abtartist"></textarea>

        <label>Upload Artwork</label>
<input type="file" id="artwork" accept="image/*">

<div id="preview"></div>

    <button type="button"   onclick="validateForm()">Submit</button>
</artform>


    
</main>
</body>


</html>
